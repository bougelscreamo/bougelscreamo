name: Update GitHub Profile Metrics

on:
  schedule:
    - cron: '0 0 * * *' # Berjalan otomatis setiap hari sekali
  workflow_dispatch: # Bisa dijalankan manual

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Fetch Metrics from GitHub
        id: fetch_metrics
        env:
          GH_TOKEN: ${{ secrets.METRIC_TOKEN }}
        run: |
          # 1. Hitung total keseluruhan repo
          TOTAL_REPOS=$(gh repo list --limit 1000 --json name --jq '. | length')
          echo "TOTAL=$TOTAL_REPOS" >> $GITHUB_OUTPUT

          # 2. Ambil data repo mentah dalam bentuk JSON
          gh repo list --limit 10 --json name,updatedAt,isPrivate > repos.json

          # 3. Proses JSON menggunakan jq dengan struktur array agar bebas error escaping
          echo -e "### 🔥 Top 10 Active Repositories (Past Year):\n<ul>" > top_repos.txt
          jq -r '.[] | [ .name, (if .isPrivate then "🔒 (Private)" else "🌐 (Public)" end), .updatedAt[0:10] ] | "  <li><strong>\(.[0])</strong> \(.[1]) — <em>Last active: \(.[2])</em></li>"' repos.json >> top_repos.txt
          echo "</ul>" >> top_repos.txt
          
      - name: Update README.md
        run: |
          TOTAL_REPOS=${{ steps.fetch_metrics.outputs.TOTAL }}
          
          # Update total repo
          sed -i "/<!-- REPO_COUNT_START -->/,/<!-- REPO_COUNT_END -->/c\<!-- REPO_COUNT_START -->\n📊 **Total Repositories:** $TOTAL_REPOS (including private projects)\n<!-- REPO_COUNT_END -->" README.md

          # Update daftar Top 10 Repo teraktif
          sed -i '/<!-- TOP_REPOS_START -->/,/<!-- TOP_REPOS_END -->/ {
            /<!-- TOP_REPOS_START -->/b
            /<!-- TOP_REPOS_END -->/b
            d
          }' README.md
          
          # Memasukkan isi file top_repos.txt ke dalam penanda di README
          sed -i '/<!-- TOP_REPOS_START -->/r top_repos.txt' README.md

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update profile metrics and top repos"
          git push
